<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=780, height=1688" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Vídeo del portal de clientes de MASSolisapp: pantalla de móvil (390×844 a 2x), en bucle */
      :root {
        --ground: #7abdf3;   /* azul del fondo de la app, también barra de estado */
        --ink: #0a1638;      /* azul marino de MASSolis */
        --navy: #0e1f4d;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 780px; height: 1688px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--font-display); }

      /* Barra de estado del móvil */
      #estado {
        position: absolute; left: 0; top: 0; width: 780px; height: 88px; z-index: 50;
        background: var(--ground); color: var(--ink);
        display: flex; align-items: center; justify-content: space-between; padding: 14px 56px 0 64px;
      }
      #estado .hora { font-size: 31px; font-weight: 700; letter-spacing: -0.01em; }
      #estado .iconos { display: flex; gap: 12px; align-items: center; }

      /* Pantallas de la app, debajo de la barra de estado */
      .pantalla { position: absolute; left: 0; top: 88px; width: 780px; height: 1600px; overflow: hidden; }
      .pantalla .in { position: absolute; inset: 0; box-shadow: -30px 0 60px rgba(10, 22, 56, 0.18); }
      .pantalla img { display: block; width: 780px; height: 1600px; }

      /* Toque con el dedo */
      .toque { position: absolute; width: 140px; height: 140px; z-index: 40; }
      .toque .anillo {
        position: absolute; inset: 0; border-radius: 50%;
        background: rgba(14, 31, 77, 0.18); border: 4px solid rgba(14, 31, 77, 0.45);
      }

      /* Avisos de confirmación */
      .aviso { position: absolute; left: 60px; width: 660px; top: 120px; z-index: 45; }
      .aviso .pill {
        display: flex; align-items: center; gap: 22px; padding: 26px 32px; border-radius: 34px;
        background: var(--navy); color: #fff; font-size: 30px; font-weight: 700;
        box-shadow: 0 24px 50px rgba(10, 22, 56, 0.35);
      }
      .aviso .ok {
        width: 52px; height: 52px; border-radius: 50%; background: #3b6fd8;
        display: grid; place-items: center; flex-shrink: 0;
      }
      .aviso small { display: block; font-size: 23px; font-weight: 400; opacity: 0.8; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.2" data-width="780" data-height="1688">

      <!-- Barra de estado -->
      <div id="estado" class="clip" data-start="0" data-duration="17.2" data-track-index="9">
        <span class="hora">10:24</span>
        <span class="iconos" aria-hidden="true">
          <svg width="38" height="24" viewBox="0 0 19 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0a1638"/><rect x="5" y="6" width="3" height="6" rx="1" fill="#0a1638"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#0a1638"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0a1638"/></svg>
          <svg width="34" height="24" viewBox="0 0 17 12"><path d="M8.5 11.5 6 9a3.5 3.5 0 0 1 5 0z" fill="#0a1638"/><path d="M3.6 6.6a7 7 0 0 1 9.8 0l-1.4 1.4a5 5 0 0 0-7 0z" fill="#0a1638"/><path d="M1.2 4.2a10.4 10.4 0 0 1 14.6 0l-1.4 1.4a8.4 8.4 0 0 0-11.8 0z" fill="#0a1638"/></svg>
          <svg width="54" height="26" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0a1638" opacity=".5"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#0a1638"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#0a1638" opacity=".5"/></svg>
        </span>
      </div>

      <!-- Pantallas -->
      <div id="p-inicio" class="pantalla clip" data-start="0" data-duration="3.6" data-track-index="0"><div class="in"><img src="assets/pantallas/01-inicio.png" alt="" /></div></div>
      <div id="p-seguimiento" class="pantalla clip" data-start="3" data-duration="3.7" data-track-index="1"><div class="in"><img src="assets/pantallas/02-seguimiento.png" alt="" /></div></div>
      <div id="p-cambio" class="pantalla clip" data-start="6.2" data-duration="4" data-track-index="2"><div class="in"><img src="assets/pantallas/03-cambio.png" alt="" /></div></div>
      <div id="p-valorar" class="pantalla clip" data-start="9.7" data-duration="1.4" data-track-index="3"><div class="in"><img src="assets/pantallas/04-valorar.png" alt="" /></div></div>
      <div id="p-valorado" class="pantalla clip" data-start="10.8" data-duration="3.1" data-track-index="4"><div class="in"><img src="assets/pantallas/04b-valorado.png" alt="" /></div></div>
      <div id="p-servicios" class="pantalla clip" data-start="13.6" data-duration="1.9" data-track-index="5"><div class="in"><img src="assets/pantallas/05-servicios.png" alt="" /></div></div>
      <div id="p-mensajes" class="pantalla clip" data-start="15.2" data-duration="1.7" data-track-index="6"><div class="in"><img src="assets/pantallas/06-mensajes.png" alt="" /></div></div>
      <div id="p-inicio2" class="pantalla clip" data-start="16.6" data-duration="0.6" data-track-index="7"><div class="in"><img src="assets/pantallas/01-inicio.png" alt="" /></div></div>

      <!-- Toques (centro del botón en la captura + 88 px de barra de estado; el círculo mide 140) -->
      <div id="t1" class="toque clip" data-start="2.3" data-duration="0.7" data-track-index="8" style="left:167px;top:693px"><div class="anillo"></div></div>
      <div id="t2" class="toque clip" data-start="5.5" data-duration="0.7" data-track-index="8" style="left:320px;top:1371px"><div class="anillo"></div></div>
      <div id="t3" class="toque clip" data-start="6.9" data-duration="0.7" data-track-index="8" style="left:151px;top:433px"><div class="anillo"></div></div>
      <div id="t4" class="toque clip" data-start="8.3" data-duration="0.7" data-track-index="8" style="left:320px;top:1411px"><div class="anillo"></div></div>
      <div id="t5" class="toque clip" data-start="10.5" data-duration="0.7" data-track-index="8" style="left:520px;top:556px"><div class="anillo"></div></div>
      <div id="t6" class="toque clip" data-start="12" data-duration="0.7" data-track-index="8" style="left:320px;top:1118px"><div class="anillo"></div></div>
      <div id="t7" class="toque clip" data-start="13.4" data-duration="0.6" data-track-index="8" style="left:237px;top:1528px"><div class="anillo"></div></div>
      <div id="t8" class="toque clip" data-start="15" data-duration="0.6" data-track-index="8" style="left:402px;top:1528px"><div class="anillo"></div></div>
      <div id="t9" class="toque clip" data-start="16.4" data-duration="0.6" data-track-index="8" style="left:76px;top:1528px"><div class="anillo"></div></div>

      <!-- Avisos -->
      <div id="aviso-cambio" class="aviso clip" data-start="8.55" data-duration="1.5" data-track-index="10">
        <div class="pill"><span class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-9"/></svg></span>
          <span>Solicitud enviada</span></div>
      </div>
      <div id="aviso-valoracion" class="aviso clip" data-start="12.25" data-duration="1.6" data-track-index="10">
        <div class="pill"><span class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-9"/></svg></span>
          <span>¡Gracias por tu valoración!</span></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";

      // Navegación hacia delante: la nueva entra por la derecha y la anterior se desplaza un poco
      const empuja = (sale, entra, t) => {
        tl.fromTo(entra + " .in", { x: 780 }, { x: 0, duration: 0.45, ease: E }, t);
        tl.fromTo(sale + " .in", { x: 0 }, { x: -200, duration: 0.45, ease: E }, t);
      };
      // Cambio de pestaña o de estado: fundido rápido
      const funde = (entra, t) => tl.fromTo(entra + " .in", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, t);

      empuja("#p-inicio", "#p-seguimiento", 3.0);
      empuja("#p-seguimiento", "#p-cambio", 6.2);
      empuja("#p-cambio", "#p-valorar", 9.7);
      funde("#p-valorado", 10.8);
      funde("#p-servicios", 13.6);
      funde("#p-mensajes", 15.2);
      funde("#p-inicio2", 16.6);

      // Toques: el círculo aparece pequeño y se expande
      [["#t1", 2.3], ["#t2", 5.5], ["#t3", 6.9], ["#t4", 8.3], ["#t5", 10.5], ["#t6", 12], ["#t7", 13.4], ["#t8", 15], ["#t9", 16.4]].forEach(([id, t]) => {
        tl.fromTo(id + " .anillo", { scale: 0.35, opacity: 0.95 }, { scale: 1.25, opacity: 0, duration: 0.5, ease: "power2.out" }, t);
      });

      // Avisos: bajan desde arriba y se van
      [["#aviso-cambio", 8.55, 1.5], ["#aviso-valoracion", 12.25, 1.6]].forEach(([id, t, d]) => {
        tl.fromTo(id + " .pill", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: E }, t);
        tl.to(id + " .pill", { y: -30, opacity: 0, duration: 0.25, ease: "power2.in" }, t + d - 0.3);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
